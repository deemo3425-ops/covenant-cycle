name: Publish the book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet markdown

      # The book does not publish if the text has drifted. The sweep exits
      # non-zero on any failed check, so this step is a real gate.
      - name: Integrity sweep (68 checks)
        run: python3 anakainosis-sweep.py anakainosis.md

      - name: Render
        run: python3 site/build.py

      # And it does not publish if the renderer altered what the sweep just
      # cleared -- a curled ellipsis, a smartened quote, dropped braille.
      - name: Verify the render is faithful
        run: python3 site/verify.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
